name: Discord Embed Bildirimi

on:
  push:
    branches:
      - main

jobs:
  discord-embed-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Discord'a Gelişmiş Embed Mesaj Gönder
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "🚀 Yeni Kod Gönderildi!"
          description: |
            **Commit Mesajı:**
            ${{ github.event.head_commit.message }}
          color: 0x00FF00
          username: "Repo Bot"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          nofail: false
          fields: |
            👤 Geliştirici=${{ github.event.head_commit.author.name }}
            🌿 Branch=${{ github.ref_name }}
            📦 Repo=${{ github.repository }}
            🔗 Commit Detayları=[Değişiklikleri İncele](${{ github.event.head_commit.url }})
