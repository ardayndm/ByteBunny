name: Discord Embed Bildirimi

on:
  push:
    branches:
      - main

jobs:
  discord-embed-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Embed Gönder
        run: |
          curl -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg author "${{ github.event.head_commit.author.name }}" \
            --arg author_url "https://github.com/${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg branch_url "https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}" \
            --arg msg "${{ github.event.head_commit.message }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg repo "${{ github.repository }}" \
            '{
              username: "ByteBunny Duyuru",
              avatar_url: "https://github.com/ardayndm/ByteBunny/blob/main/Images/Bot/ByteBunny-Logo.jpg?raw=true",
              content: "@everyone Depoya yeni bir güncelleme geldi! 👇",
              embeds: [{
                author: {
                  name: "🚀 ByteBunny Güncellemesi !",
                  icon_url: "https://github.com/ardayndm/ByteBunny/blob/main/Images/Bot/ByteBunny-Logo.jpg?raw=true"
                },
                description: ("Merhaba arkadaşlar!\n\n**[" + $author + "](" + $author_url + ")** tarafından [``" + $branch + "``](" + $branch_url + ") dalına yeni bir kod gönderildi.\n\n**📝 Commit Mesajı:**\n> " + $msg + "\n\n**🔗 Detaylar:**\n[Değişiklikleri İncele](" + $url + ")"),
                color: 16731469,
                image: {
                  url: "https://github.com/ardayndm/ByteBunny/blob/main/Images/Bot/ByteBunny-Banner.png?raw=true"
                },
                footer: {
                  text: ("📦 " + $repo + " • Görüş ve katkılarınızı bekliyoruz!")
                },
                timestamp: (now | todate)
              }]
            }')" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
