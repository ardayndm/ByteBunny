name: Discord Embed Bildirimi

on:
  push:
    branches:
      - main

jobs:
  discord-embed-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Embed Gönder
        run: |
          curl -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg author "${{ github.event.head_commit.author.name }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg msg "${{ github.event.head_commit.message }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg repo "${{ github.repository }}" \
            '{
              username: "ByteBunny Duyuru",
              avatar_url: "https://raw.githubusercontent.com/ardayndm/ByteBunny/main/assets/logo.png",
              content: "@everyone Depoya yeni bir güncelleme geldi! 👇",
              embeds: [{
                author: {
                  name: "🚀 ByteBunny Yayında!",
                  icon_url: "https://raw.githubusercontent.com/ardayndm/ByteBunny/main/assets/logo.png"
                },
                description: ("Merhaba arkadaşlar!\n\n**" + $author + "** tarafından **" + $branch + "** dalına yeni bir kod gönderildi.\n\n**📝 Commit Mesajı:**\n> " + $msg + "\n\n**🔗 Detaylar:**\n[Değişiklikleri İncele](" + $url + ")"),
                color: 5793266,
                image: {
                  url: "https://raw.githubusercontent.com/ardayndm/ByteBunny/main/assets/banner.png"
                },
                footer: {
                  text: ("📦 " + $repo + " • Görüş ve katkılarınızı bekliyoruz!")
                },
                timestamp: (now | todate)
              }]
            }')" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
