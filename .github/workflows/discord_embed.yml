name: Discord Embed Bildirimi

on:
  push:
    branches:
      - main

jobs:
  discord-embed-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Embed Gönder
        run: |
          curl -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg desc "**Commit Mesajı:**\n${{ github.event.head_commit.message }}" \
            --arg author "${{ github.event.head_commit.author.name }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg repo "${{ github.repository }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            '{
              username: "Repo Bot",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [{
                title: "🚀 Yeni Kod Gönderildi!",
                description: $desc,
                color: 65280,
                fields: [
                  {name: "👤 Geliştirici", value: $author, inline: true},
                  {name: "🌿 Branch", value: $branch, inline: true},
                  {name: "📦 Repo", value: $repo, inline: true},
                  {name: "🔗 Commit Detayları", value: ("[Değişiklikleri İncele](" + $url + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: (now | todate)
              }]
            }')" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
