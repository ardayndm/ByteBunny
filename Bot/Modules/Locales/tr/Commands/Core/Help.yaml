# ── Meta ──────────────────────────────────────────────────────────
name: "help" # Dosya adı ile aynı olmak zorunda ki help vb. gibi komutlar tarafından görülebilsin. isim değişirse dosya adı da değişmeli.
description: "Komut hakkında bilgi verir."
usage: "komut_adi <zorunlu> [opsiyonel]"

examples:
  1: "`{prefix}help`"
  2: "`{prefix}help <komut>`"

# ── Başlıklar ─────────────────────────────────────────────────────
# Embed'in sol üst köşesinde görünür.
# Komuta özel olmayanlar Common.yaml > titles'a fallback yapar.
titles:
  error: "❌ **İşlem Başarısız**"
  info: "📖 **Komut Detayları**"

# ── Mesajlar ──────────────────────────────────────────────────────
# Embed gövdesi. {placeholder} sözdizimi desteklenir.
# Komuta özel olmayanlar Common.yaml > messages'a fallback yapar.
# Hata mesajları err_ önekiyle başlar.
messages:
  info: |
    **Kullanım Rehberi:**
    İstediğin komutun detaylarını aşağıda inceleyebilirsin:
  general_info: |
    ** İhtiyacın olan komutu bulamadın mı?**

    Bu komutla ilgili detaylı bilgi almak için bir komut ismi belirtmen gerekiyor.

    > **İpucu:** Tüm komut listesini görüntülemek için `{prefix}listcommands [sayfaNo]` ya da `/listcommands [sayfaNo]` komutunu kullanabilirsin.
  err_not_found: |
    **Komut Bulunamadı**

    Aradığın isimde bir komut mevcut değil. 
    > Lütfen komut adını kontrol et veya tüm listeyi görmek için `{prefix}listcommands [sayfaNo]` ya da `/listcommands [sayfaNo]` yaz.

# ── İçerikler ──────────────────────────────────────────────────────
# Embed gövdesi. {placeholder} sözdizimi desteklenir.
# Hata mesajları err_ önekiyle başlar.
# Öğeler id'de yazan metin numara yakalanır.
# Opsiyoneldir.

fields:
  - id: 1
    name: "🛠️ Kullanım Formatı"
    value: "`{command_usage}`"
    inline: false
  - id: 2
    name: "💡 Örnek Kullanımlar"
    value: "{command_examples}"
    inline: false
  - id: 3
    name: "⏱️ Bekleme süresi"
    value: "**{duration}**" # saniye formatına yazılacaktır
    inline: true
  - id: 4
    name: "📂 Kategori"
    value: "**{category}**"
    inline: true

# ── İkonlar ───────────────────────────────────────────────────────
# Opsiyonel. Komuta özel olmayanlar Common.yaml > icons'a fallback yapar.
icons:
  info: ""

# ── Son alt yazı ───────────────────────────────────────────────────────
# Opsiyonel. ByteBunny • Command    şeklinde yazı için kullanılır.
footers:
  default: "Yardım"
# ── Ayarlar ───────────────────────────────────────────────────────
options:
  # Genel — her komutta bulunur
  enabled: true
  category: "utility" # general | moderation | utility | fun | ...
  ephemeral: false
  prefix: true
  cooldown: 2.0 # saniye
  categories:
    other: "❓ Diğer"
    utility: "⚙️ Yardımcı"
    moderation: "🛡️ Moderasyon"

  # Slash argümanları — opsiyonel
  slash:
    - name: "komut"
      description: "Bilgi alınacak komut adı."
      type: "string" # user | string | integer | boolean | channel | role
      required: false
