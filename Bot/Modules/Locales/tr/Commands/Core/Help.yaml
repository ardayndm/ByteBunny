# ==============================================================================
# Bot/Modules/Locales/tr/Command.example.yaml
# ==============================================================================
#
# Yeni bir komut yazarken bu dosyayı kopyala ve bu yapıyı kullan
#
# ==============================================================================

# ── Meta ──────────────────────────────────────────────────────────
name: "help"
description: "Komut hakkında bilgi verir."
usage: "komut_adi <zorunlu> [opsiyonel]"

examples:
  1: "`{prefix}help`"
  2: "`{prefix}help <komut>`"

# ── Başlıklar ─────────────────────────────────────────────────────
# Embed'in sol üst köşesinde görünür.
# Komuta özel olmayanlar Common.yaml > titles'a fallback yapar.
titles:
  error: "❌ Hata"
  info: "ℹ️ Bilgi"

# ── Mesajlar ──────────────────────────────────────────────────────
# Embed gövdesi. {placeholder} sözdizimi desteklenir.
# Komuta özel olmayanlar Common.yaml > messages'a fallback yapar.
# Hata mesajları err_ önekiyle başlar.
messages:
  info: "Test"
  err_not_found: "Bulunamadı"

# ── İçerikler ──────────────────────────────────────────────────────
# Embed gövdesi. {placeholder} sözdizimi desteklenir.
# Hata mesajları err_ önekiyle başlar.
# Öğeler id'de yazan metin numara yakalanır.
# Opsiyoneldir.

fields:
  - id: 1
    name: "Kullanımlar"
    value: "{command_usage}"
    inline: false
  - id: 2
    name: "Örnekler"
    value: "{command_examples}"
    inline: false
  - id: 3
    name: "Bekleme süresi"
    value: "{duration}"
    inline: true
  - id: 4
    name: "Kategori"
    value: "{category}"
    inline: true

# ── İkonlar ───────────────────────────────────────────────────────
# Opsiyonel. Komuta özel olmayanlar Common.yaml > icons'a fallback yapar.
icons:
  info: ""

# ── Son alt yazı ───────────────────────────────────────────────────────
# Opsiyonel. ByteBunny • Command    şeklinde yazı için kullanılır.
footers:
  default: "Command"
# ── Ayarlar ───────────────────────────────────────────────────────
options:
  # Genel — her komutta bulunur
  enabled: true
  category: "utility" # general | moderation | utility | fun | ...
  ephemeral: false
  prefix: true
  cooldown: 2.0 # saniye
  categories:
    other: "❓ Diğer"
    utility: "⚙️ Yardımcı"
    moderation: "🛡️ Moderasyon"

  # Slash argümanları — opsiyonel
  slash:
    - name: "komut"
      description: "Bilgi alınacak komut adı."
      type: "string" # user | string | integer | boolean | channel | role
      required: false
